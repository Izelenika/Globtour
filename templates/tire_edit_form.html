{% extends "base.html" %}{% block content %}
<div class="title"><div><h1>Uredi gumu</h1><div class="muted">Uredi podatke o pojedinačnoj gumi.</div></div><a class="btn secondary" href="/gume">Natrag</a></div>
<div class="panel"><form method="post"><input type="hidden" name="next" value="{{ request.args.get('next', '') }}"><div class="grid">
<div class="field"><label>Serijski broj</label><input name="serial_number" value="{{tire.serial_number or ''}}"></div>
<div class="field"><label>Dimenzija *</label><input required name="dimension" value="{{tire.dimension or ''}}"></div>
<div class="field"><label>Marka</label><input name="brand" value="{{tire.brand or ''}}"></div>
<div class="field"><label>Tip</label><select name="tire_type"><option></option>{% for x in types %}<option {% if tire.tire_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Status</label><select name="status">{% for x in ['Skladište','Montirana','Rashodovana'] %}<option {% if tire.status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Skladište</label><select name="warehouse"><option value=""></option>{% for x in warehouses %}<option {% if tire.warehouse==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Vozilo</label><select name="vehicle"><option value=""></option>{% for v in vehicles %}<option {% if tire.vehicle==v.registration %}selected{% endif %}>{{v.registration}}</option>{% endfor %}</select></div>
<div class="field"><label>Pozicija</label><select name="position"><option value=""></option>{% for x in positions %}<option {% if tire.position==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Datum montaže</label><input type="date" name="mounted_date" value="{{tire.mounted_date or ''}}"></div>
<div class="field"><label>KM montaže</label><input type="number" name="mounted_km" value="{{tire.mounted_km or ''}}"></div>
<div class="field"><label>Datum demontaže</label><input type="date" name="demounted_date" value="{{tire.demounted_date or ''}}"></div>
<div class="field"><label>KM demontaže</label><input type="number" name="demounted_km" value="{{tire.demounted_km or ''}}"></div>
<div class="field"><label>Odgovorna osoba</label><input name="responsible" value="{{tire.responsible or ''}}"></div>
</div>
<div class="field"><label>Napomena</label><textarea name="note">{{tire.note or ''}}</textarea></div>
<button class="btn">Spremi izmjene</button>
</form></div>{% endblock %}
