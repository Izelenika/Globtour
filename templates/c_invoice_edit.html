{% extends "base.html" %}{% block content %}
<div class="title"><div><h1>✏️ Uredi C-fakturu</h1><div class="muted">Cijena se automatski računa prema kilometraži, ali je možeš i ručno promijeniti.</div></div></div>
<div class="panel"><form method="post" id="cfForm"><div class="form-grid">
<div class="field"><label>Broj C-fakture</label><input name="document_no" value="{{row.document_no or ''}}"></div><div class="field"><label>Datum izdavanja</label><input type="date" name="issue_date" value="{{row.issue_date or ''}}"></div><div class="field"><label>Valuta</label><select name="currency" id="currency"><option value="BAM" {% if (row.currency or 'BAM')=='BAM' %}selected{% endif %}>BAM</option><option value="EUR" {% if row.currency=='EUR' %}selected{% endif %}>EUR</option></select></div>
<div class="field"><label>Klijent</label><input name="client" value="{{row.client or ''}}"></div><div class="field"><label>Glavna relacija</label><input name="relation" value="{{row.relation or ''}}"></div><div class="field"><label>Datum početka</label><input type="date" name="date_from" value="{{row.date_from or ''}}"></div><div class="field"><label>Datum završetka</label><input type="date" name="date_to" value="{{row.date_to or ''}}"></div>
<div class="field"><label>Vozilo</label><select name="vehicle"><option value=""></option>{% for v in vehicles %}<option value="{{v.registration}}" {% if row.vehicle==v.registration %}selected{% endif %}>{{v.registration}}</option>{% endfor %}</select></div>
<div class="field"><label>Vozač 1</label><select name="driver1"><option value=""></option>{% for d in drivers %}<option value="{{d.name}}" {% if row.driver1==d.name %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select></div><div class="field"><label>Vozač 2</label><select name="driver2"><option value=""></option>{% for d in drivers %}<option value="{{d.name}}" {% if row.driver2==d.name %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select></div>
<div class="field"><label>Broj putnika</label><select id="band"><option value="63-75">63–75</option><option value="51-63" selected>51–63</option><option value="15-51">15–51</option><option value="3-15">3–15</option><option value="1-3">1–3</option></select></div><div class="field"><label>Vrsta kupca</label><select id="customer"><option>D. Ljubić</option><option selected>Stalni kupci</option><option>Novi kupci</option></select></div>
<div class="field"><label>Ukupan iznos</label><input id="amount" type="number" step="0.01" name="amount" value="{{row.amount or 0}}"></div><div class="field full"><label>Napomena</label><textarea name="notes">{{row.notes or ''}}</textarea></div></div>
<h2>Vožnje i obračun</h2><div style="overflow:auto"><table class="table" id="items"><thead><tr><th>Datum</th><th>Relacija</th><th>KM ukupno</th><th>KM BiH</th><th>KM HR</th><th>KM INO</th><th>Cijena/km</th><th>Ukupno</th><th></th></tr></thead><tbody>{% for i in items %}<tr><td><input type="date" name="item_date[]" value="{{i.item_date or ''}}"></td><td><input name="item_relation[]" value="{{i.relation or ''}}"></td><td><input class="km item-km-total" type="number" step="0.01" name="item_km_total[]" readonly value="{{i.km_total or 0}}"></td><td><input type="number" step="0.01" class="item-km-bih" name="item_km_bih[]" value="{{i.km_bih or 0}}"></td><td><input type="number" step="0.01" class="item-km-hr" name="item_km_hr[]" value="{{i.km_hr or 0}}"></td><td><input type="number" step="0.01" class="item-km-ino" name="item_km_ino[]" value="{{i.km_ino or 0}}"></td><td><input class="price" type="number" step="0.01" name="item_price[]" value="{{i.price_per_km or 0}}"></td><td><input class="lineamount" type="number" step="0.01" name="item_amount[]" value="{{i.amount or 0}}"></td><td><button type="button" class="btn secondary remove">✕</button></td></tr>{% else %}<tr><td><input type="date" name="item_date[]"></td><td><input name="item_relation[]"></td><td><input class="km item-km-total" type="number" step="0.01" name="item_km_total[]" readonly value="0"></td><td><input type="number" step="0.01" class="item-km-bih" name="item_km_bih[]" value="0"></td><td><input type="number" step="0.01" class="item-km-hr" name="item_km_hr[]" value="0"></td><td><input type="number" step="0.01" class="item-km-ino" name="item_km_ino[]" value="0"></td><td><input class="price" type="number" step="0.01" name="item_price[]" value="0"></td><td><input class="lineamount" type="number" step="0.01" name="item_amount[]" value="0"></td><td><button type="button" class="btn secondary remove">✕</button></td></tr>{% endfor %}</tbody></table></div><button type="button" class="btn secondary" id="add">＋ Dodaj vožnju</button><div style="margin-top:20px"><button class="btn">💾 Spremi i zatvori</button> <a class="btn secondary" href="/c-fakture/{{row.id}}">Odustani</a></div></form></div>
<script>(()=>{const R=1.95583,P={"63-75":{"D. Ljubić":2.4,"Stalni kupci":2.5,"Novi kupci":3},"51-63":{"D. Ljubić":1.9,"Stalni kupci":2,"Novi kupci":2.5},"15-51":{"D. Ljubić":1.6,"Stalni kupci":1.7,"Novi kupci":2},"3-15":{"D. Ljubić":1.2,"Stalni kupci":1.4,"Novi kupci":1.6},"1-3":{"D. Ljubić":.75,"Stalni kupci":.75,"Novi kupci":.75}},e=x=>document.getElementById(x),body=document.querySelector('#items tbody');function calc(){let p=P[e('band').value][e('customer').value]*(e('currency').value==='BAM'?R:1),sum=0;body.querySelectorAll('tr').forEach(r=>{let km=(parseFloat(r.querySelector('.item-km-bih').value)||0)+(parseFloat(r.querySelector('.item-km-hr').value)||0)+(parseFloat(r.querySelector('.item-km-ino').value)||0);r.querySelector('.km').value=km.toFixed(2);let pr=r.querySelector('.price'),am=r.querySelector('.lineamount');if(!pr.value || parseFloat(pr.value)===0)pr.value=p.toFixed(2);if(document.activeElement!==am)am.value=(km*(parseFloat(pr.value)||0)).toFixed(2);sum+=parseFloat(am.value)||0});if(document.activeElement!==e('amount'))e('amount').value=sum.toFixed(2)}function bind(r){r.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));r.querySelector('.remove').onclick=()=>{if(body.children.length>1){r.remove();calc()}}}body.querySelectorAll('tr').forEach(bind);e('add').onclick=()=>{let r=body.querySelector('tr').cloneNode(true);r.querySelectorAll('input').forEach(x=>{if(x.type==='number')x.value=0;else x.value=''});body.appendChild(r);bind(r);calc()};['band','customer','currency'].forEach(x=>e(x).addEventListener('change',calc));calc()})();</script>
{% endblock %}
