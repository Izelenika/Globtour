{% extends "base.html" %}{% block content %}
<div class="title"><h1>Nabava guma</h1><a class="btn secondary" href="/gume">Natrag</a></div>
<div class="panel"><form method="post"><div class="grid">
<div class="field"><label>Datum</label><input type="date" name="purchase_date" value="{{today}}"></div>
<div class="field"><label>Dobavljač</label><input name="supplier"></div>
<div class="field"><label>Faktura</label><input name="invoice"></div>
<div class="field"><label>Skladište</label><select name="warehouse">{% for x in warehouses %}<option>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Dimenzija *</label><input required name="dimension" placeholder="295/80 R22.5"></div>
<div class="field"><label>Marka</label><input name="brand"></div>
<div class="field"><label>Tip</label><select name="tire_type"><option></option>{% for x in types %}<option>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Količina *</label><input required type="number" min="1" name="quantity" value="1"></div>
</div>
<div class="field">
<label>Serijski brojevi guma</label>
<div id="serial-numbers-container"></div>
<div class="muted">Za svaku nabavljenu gumu otvara se posebno polje za unos serijskog broja.</div>
</div>
<div class="field"><label>Napomena</label><textarea name="note"></textarea></div>
<button class="btn">Spremi nabavu</button></form></div>
<script>
(function(){
  const qtyInput = document.querySelector('input[name="quantity"]');
  const container = document.getElementById('serial-numbers-container');

  function renderSerialFields(){
    let qty = parseInt(qtyInput.value, 10);
    if (!Number.isFinite(qty) || qty < 1) qty = 1;

    const oldValues = Array.from(container.querySelectorAll('input[name="serial_numbers"]'))
      .map(input => input.value);

    container.innerHTML = '';
    for(let i = 0; i < qty; i++){
      const field = document.createElement('div');
      field.className = 'field';
      field.style.marginBottom = '8px';

      const input = document.createElement('input');
      input.type = 'text';
      input.name = 'serial_numbers';
      input.placeholder = 'Serijski broj gume ' + (i + 1);
      input.value = oldValues[i] || '';

      field.appendChild(input);
      container.appendChild(field);
    }
  }

  qtyInput.addEventListener('input', renderSerialFields);
  qtyInput.addEventListener('change', renderSerialFields);
  renderSerialFields();
})();
</script>{% endblock %}
