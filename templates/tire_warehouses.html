{% extends "base.html" %}
{% block content %}
<div class="title">
  <div>
    <h1>📦 Stanje po skladištima</h1>
    <div class="muted">Odaberi skladište za detaljan pregled svih guma koje se trenutno nalaze u njemu.</div>
  </div>
  <a class="btn secondary" href="{{ url_for('tires_dashboard') }}">← Nazad</a>
</div>

<div class="warehouse-cards">
  {% for w in warehouses %}
  <a class="warehouse-card" href="{{ url_for('tire_warehouse', warehouse=w.name) }}">
    <strong>📍 {{ w.name }}</strong>
    <b>{{ w.quantity }}</b>
    <span>guma na skladištu</span>
  </a>
  {% endfor %}
</div>

<style>
.warehouse-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}
.warehouse-card{display:flex;flex-direction:column;gap:10px;min-height:150px;padding:24px;border:1px solid var(--border,#d9e0ea);border-radius:14px;background:var(--card,#fff);text-decoration:none;color:inherit;box-sizing:border-box;transition:.15s}
.warehouse-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.warehouse-card b{font-size:36px;line-height:1.1}
.warehouse-card span{color:var(--muted,#667085)}
@media(max-width:900px){.warehouse-cards{grid-template-columns:1fr}}
</style>
{% endblock %}
