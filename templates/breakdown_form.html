{% extends "base.html" %}{% block content %}
<div class="title"><div><h1>{{'Uredi kvar' if row else 'Prijavi kvar'}}</h1><div class="muted">Evidencija problema na vozilu tijekom vožnje</div></div><a class="btn secondary" href="/kvarovi">← Natrag</a></div>
<form method="post" class="panel form-grid">
<div class="field"><label>Tvrtka / baza</label>
<select name="company">
<option value="">Odaberi tvrtku / bazu</option>
{% for x in ['GLOBTOUR','CROATIABUS','JADRANEKSPRES KOTOR'] %}
<option value="{{x}}" {% if row and row.company==x %}selected{% endif %}>{{x}}</option>
{% endfor %}
</select>
</div>
<div class="field"><label>Vozilo *</label><select name="vehicle" required><option value="">Odaberi vozilo</option>{% for x in vehicles %}<option value="{{x}}" {% if row and row.vehicle==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Datum kvara *</label><input type="date" name="breakdown_date" required value="{{row.breakdown_date if row else today}}"></div>
<div class="field"><label>Linija</label><select name="line"><option value="">Odaberi liniju</option>{% for x in lines %}<option value="{{x}}" {% if row and row.line==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Mjesto</label><input name="location" value="{{row.location if row else ''}}"></div><div class="field"><label>Kategorija</label><select name="category">{% for x in ['Motor','Mjenjač','Zrak','AdBlue','Klima','Elektrika','Gume / kotači','Gorivo','Voda / hlađenje','Karoserija','Ostalo'] %}<option {% if row and row.category==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Vozač 1</label><select name="driver1"><option value="">Odaberi vozača</option>{% for x in drivers %}<option value="{{x}}" {% if row and row.driver1==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Vozač 2</label><select name="driver2"><option value="">Odaberi vozača</option>{% for x in drivers %}<option value="{{x}}" {% if row and row.driver2==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Hitnost</label><select name="severity">{% for x in ['Nizak','Srednji','Visok','Kritično'] %}<option {% if row and row.severity==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Status</label><select name="status">{% for x in ['Prijavljen','U obradi','Zatvoren'] %}<option {% if row and row.status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Datum popravka</label><input type="date" name="repair_date" value="{{row.repair_date if row else ''}}"></div><div class="field"><label>Zastoj (sati)</label><input type="number" step="0.5" min="0" name="downtime_hours" value="{{row.downtime_hours if row else 0}}"></div><div class="field"><label>Trošak popravka (BAM)</label><input type="number" step="0.01" min="0" name="repair_cost" value="{{row.repair_cost if row else 0}}"></div>
<div class="field full"><label>Opis kvara</label><textarea name="description" rows="5">{{row.description if row else ''}}</textarea></div><div class="field full"><label>Kako je kvar riješen / poduzete mjere</label><textarea name="solution" rows="4">{{row.solution if row else ''}}</textarea></div><div class="full"><button class="btn">{{'Spremi promjene' if row else 'Evidentiraj kvar'}}</button></div>
</form>{% endblock %}
