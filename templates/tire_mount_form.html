{% extends "base.html" %}{% block content %}<div class="title"><div><h1>Montaža gume</h1><div class="muted">Guma nakon spremanja izlazi iz skladišta.</div></div><a class="btn secondary" href="/gume">Natrag</a></div><div class="panel"><form method="post"><div class="grid">
<div class="field"><label>Tip / pozicija *</label><select id="position" name="position" required><option value="">Odaberi tip</option>{% for x in positions %}<option value="{{x}}">{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>Guma *</label><select id="tire_id" name="tire_id" required><option value="">Prvo odaberi tip</option>{% for x in tires %}<option value="{{x.id}}" data-type="{{x.tire_type}}">{{x.dimension}} | {{x.brand or ''}} | {{x.serial_number or 'bez serijskog broja'}} | {{x.warehouse}} | {{x.tire_type}}</option>{% endfor %}</select></div>
<div class="field"><label>Vozilo *</label><select name="vehicle" required>{% for x in vehicles %}<option>{{x.registration}}</option>{% endfor %}</select></div>

<div class="field"><label>Datum montaže</label><input type="date" name="event_date" value="{{today}}"></div>
<div class="field"><label>KM na dan montaže</label><input type="number" min="0" name="km"></div>
<div class="field"><label>Odgovorna osoba</label><input name="responsible"></div>
</div><button class="btn">Evidentiraj montažu</button></form></div>
<script>
(function(){
 const pos=document.getElementById('position');
 const tire=document.getElementById('tire_id');
 function norm(v){return (v||'').trim().toLocaleLowerCase();}
 function filter(){
   const selected=norm(pos.value);
   tire.value='';
   Array.from(tire.options).forEach(function(o,i){
     if(i===0){o.hidden=!!selected; o.textContent=selected?'Odaberi gumu':'Prvo odaberi tip'; return;}
     o.hidden=!selected || norm(o.dataset.type)!==selected;
   });
 }
 pos.addEventListener('change',filter);
 filter();
})();
</script>{% endblock %}
