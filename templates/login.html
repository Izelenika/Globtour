<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava – Globtour Međugorje</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="login-page">
<div class="login-card">
  <div class="login-brand"><span class="brand-logo"><img src="{{url_for('static',filename='globtour-bird.png')}}" alt="Globtour"></span><div><div>globtour</div><strong>Međugorje</strong></div></div>
  <h1>Prijava</h1><p class="muted">Prijavite se za nastavak rada.</p>
  {% if error %}<div class="login-error">{{error}}</div>{% endif %}
  <form method="post" action="/login">
    <div class="field"><label>Korisničko ime</label><input name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label>Lozinka</label><input type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%;margin-top:8px">Prijava</button>
  </form>
</div></body></html>
